# Each notification channel is a named entry under `notifications`.
# Fields:
#   type:          ntfy
#   role:          alerts | errors | digest
#   environments:  [dev, prod]
#   enabled:       true/false
#   server:        ntfy server URL
#   topic:         ntfy topic name (use a unique name; prefer a token)
#   token:         optional bearer token
#   priority:      min, low, default, high, max
#   tags:          list of ntfy tags

notifications:
  ntfy-dev-alerts:
    type: ntfy
    role: alerts
    environments: [dev]
    enabled: false
    server: "https://ntfy.sh"
    topic: "my-daft-dev-alerts"
    priority: "default"
    tags: ["house"]

  ntfy-dev-errors:
    type: ntfy
    role: errors
    environments: [dev]
    enabled: true
    server: "https://ntfy.sh"
    topic: "my-daft-dev-errors"
    priority: "high"
    tags: ["warning"]

  ntfy-prod-alerts:
    type: ntfy
    role: alerts
    environments: [prod]
    enabled: false
    server: "https://ntfy.sh"
    topic: "my-daft-prod-alerts"
    priority: "default"
    tags: ["house"]

  ntfy-prod-errors:
    type: ntfy
    role: errors
    environments: [prod]
    enabled: true
    server: "https://ntfy.sh"
    topic: "my-daft-prod-errors"
    priority: "high"
    tags: ["warning"]

  # Requires digest_day to be set at the top of this file.
  # ntfy-prod-digest:
