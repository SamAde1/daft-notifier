# Observation-mode example config (rent / sharing container).
# Copy to config.yaml and edit notification topics. Do not commit the copy.
#
# Live Daft counts on 2026-08-15 (first-page totalResults):
#   Dublin sharing 927, rent 1228; Kildare 167/140; Meath 121/75; Wicklow 82/67.
#   Dublin City is a subset of county Dublin for these sections, so location
#   is county-only. Each county is its own search so a large Dublin inventory
#   cannot stall Kildare/Meath/Wicklow lifecycle updates.
#
# First production week: leave notify: false, do not enable digest_day, and
# keep listing-alert notifiers disabled. Error notifiers stay on.

check_interval_minutes: 30
data_dir: "./data"
distance_to_location: true
location_name: "City Centre"
location_latitude: 53.3473
location_longitude: -6.2591

removal_grace_hours: 48
deep_scan_max_pages: 120
deep_scan_min_interval_hours: 24

# Weekly digest — enable only after a clean week of observation data.
# digest_day: "sunday"
# digest_hour: 9
# digest_timezone: "Europe/Dublin"

searches:
  - name: "Dublin Sharing"
    id: "dublin-sharing"
    search_type: "SHARING"
    location: ["Dublin"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Kildare Sharing"
    id: "kildare-sharing"
    search_type: "SHARING"
    location: ["Kildare"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Meath Sharing"
    id: "meath-sharing"
    search_type: "SHARING"
    location: ["Meath"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Wicklow Sharing"
    id: "wicklow-sharing"
    search_type: "SHARING"
    location: ["Wicklow"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Dublin Residential Rent"
    id: "dublin-rent"
    search_type: "RESIDENTIAL_RENT"
    location: ["Dublin"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Kildare Residential Rent"
    id: "kildare-rent"
    search_type: "RESIDENTIAL_RENT"
    location: ["Kildare"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Meath Residential Rent"
    id: "meath-rent"
    search_type: "RESIDENTIAL_RENT"
    location: ["Meath"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

  - name: "Wicklow Residential Rent"
    id: "wicklow-rent"
    search_type: "RESIDENTIAL_RENT"
    location: ["Wicklow"]
    notify: false
    deep_scan: true
    shallow_pages: 2
    sort_type: "PUBLISH_DATE_DESC"

# Optional later: a narrow alert search alongside observation.
# - name: "Dublin Sharing Ensuite Alert"
