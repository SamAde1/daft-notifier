# Production: pin a release tag, for example:
#   DAFT_NOTIFIER_IMAGE=ghcr.io/samade1/daft-notifier:vX.Y.Z
# Do not follow `latest` while Watchtower or pull_policy would auto-roll a
# schema-changing image onto live databases.
services:
  daft-monitor:
    image: ${DAFT_NOTIFIER_IMAGE:-ghcr.io/samade1/daft-notifier:latest}
    pull_policy: always
    container_name: daft-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      DAFT_MONITOR_CONFIG: /app/config.yaml
      DAFT_MONITOR_ENVIRONMENT: prod
      DAFT_MONITOR_LOG_LEVEL: info
      DAFT_MONITOR_WRITE_LOGS: "true"
      DAFT_MONITOR_LOG_DIR: /app/logs
      DAFT_MONITOR_STARTUP_TEST_NOTIFICATIONS: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
