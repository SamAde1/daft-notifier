[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daft-notifier"
version = "1.2.0"
description = "Monitor Daft.ie listings, record them in SQLite, and notify via ntfy"
requires-python = ">=3.11"
dependencies = [
    "daftlistings==2.0.5",
    "PyYAML==6.0.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
scripts = [
    "matplotlib==3.10.8",
    "pandas==2.3.3",
    "numpy==2.4.2",
]
test = [
    "pytest==8.4.1",
    "ruff==0.12.11",
]

[tool.setuptools.packages.find]
include = ["daft_monitor*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["daft_monitor", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["daft_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
